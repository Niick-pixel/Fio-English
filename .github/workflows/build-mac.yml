# Compila English Coach en una Mac de GitHub y publica el instalador.
# - En cada push: tests + .dmg/.zip para Apple Silicon e Intel (descargables desde la ejecución).
# - En push a main (o a mano desde la pestaña Actions): además crea/actualiza el Release v<versión>.
name: Build macOS app

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests y validación del contenido
        run: |
          npm test
          npm run validate-content

      - name: Compilar .dmg y .zip (arm64 + x64)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verificar firma ad-hoc
        run: |
          for app in "dist/mac-arm64/English Coach.app" "dist/mac/English Coach.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Probar que la app abre (arm64)
        run: |
          "dist/mac-arm64/English Coach.app/Contents/MacOS/English Coach" > app.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "La app sigue abierta después de 20 s ✓"
            kill "$PID"
          else
            echo "La app se cerró sola:"; cat app.log; exit 1
          fi

      - name: Guardar instaladores en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: English-Coach-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Leer versión
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publicar Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: English Coach ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            ## Cómo instalar

            **Opción recomendada (sin bloqueos de macOS):** abrí la app *Terminal* y pegá:

            ```
            curl -fsSL https://raw.githubusercontent.com/Niick-pixel/Fio-English/main/install.sh | bash
            ```

            **O manualmente:** descargá el `.dmg` de tu Mac (`arm64` = Apple Silicon M1/M2/M3/M4, `x64` = Intel), arrastrá la app a *Aplicaciones* y seguí los pasos del README para abrirla la primera vez.
